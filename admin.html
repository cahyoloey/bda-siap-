<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Siap?</title>
<style>
:root{--ink:#22301C;--cream:#FBF6EC;--line:#E5DCC8;--terra:#C4622D;--sage:#6F8A5B}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}h1{font-size:26px;margin:0 0 4px}h2{font-size:17px;margin:34px 0 12px}
.sub{color:#5a6652;font-size:14px;margin:0 0 22px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card b{display:block;font-size:30px;font-weight:600}.card span{font-size:13px;color:#5a6652}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{background:#F3EBDA;font-weight:600}
.scroll{overflow-x:auto}.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}.bar i{display:block;height:14px;background:var(--sage);border-radius:4px}.bar em{font-style:normal;min-width:150px}
.login{max-width:340px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}.login input{width:100%;padding:11px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;font:inherit}
button{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer;width:100%}.err{color:#B3402A;font-size:13px;margin-top:8px}
.pill{background:#F3EBDA;border-radius:100px;padding:2px 10px;font-size:12px}.pro{background:var(--terra);color:#fff}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var C=window.SIAP_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY),app=document.getElementById('app');
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function loginView(msg){
  app.innerHTML='<div class="login"><h1>Admin Siap?</h1><p class="sub">Khusus tim.</p><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Kata sandi"><button id="go">Masuk</button><div class="err">'+esc(msg||'')+'</div></div>';
  document.getElementById('go').onclick=async function(){
    var r=await sb.auth.signInWithPassword({email:document.getElementById('e').value,password:document.getElementById('p').value});
    if(r.error)return loginView(r.error.message); load();
  };
}
async function load(){
  var s=(await sb.auth.getSession()).data.session; if(!s)return loginView();
  var me=(await sb.from('profiles').select('role').eq('id',s.user.id).single()).data;
  if(!me||me.role!=='admin'){await sb.auth.signOut();return loginView('Akun ini bukan admin.');}
  var [ev,pr,pay]=await Promise.all([
    sb.from('events').select('*').order('created_at',{ascending:false}).limit(2000),
    sb.from('profiles').select('*').order('created_at',{ascending:false}),
    sb.from('payments').select('*').order('created_at',{ascending:false})]);
  ev=ev.data||[];pr=pr.data||[];pay=pay.data||[];
  var email={};pr.forEach(function(p){email[p.id]=p.email});
  var uniq={};ev.filter(function(e){return e.name==='page_view'}).forEach(function(e){uniq[e.session_id]=1});
  var cnt={};ev.forEach(function(e){cnt[e.name]=(cnt[e.name]||0)+1});
  var paid=pay.filter(function(p){return p.status==='paid'});
  var pros=pr.filter(function(p){return p.plan==='pro'&&p.plan_until&&new Date(p.plan_until)>new Date()}).length;
  var conv=pr.length?Math.round(pros/pr.length*100):0;
  var max=Math.max.apply(null,Object.values(cnt).concat([1]));
  function card(n,l){return '<div class="card"><b>'+n+'</b><span>'+l+'</span></div>'}
  app.innerHTML='<div class="wrap"><h1>Dashboard Siap?</h1><p class="sub">Masuk sebagai '+esc(s.user.email)+' · <a href="index.html">ke website</a> · <a href="#" id="out">keluar</a></p>'
  +'<div class="cards">'+card(Object.keys(uniq).length,'Pengunjung unik')+card(pr.length,'Akun terdaftar')+card(cnt.klik_beli_pro||0,'Klik "Beli Pro"')+card(paid.length,'Pembayaran berhasil')+card(pros,'Pengguna Pro aktif')+card(conv+'%','Pro dari total akun')+card('Rp'+(paid.reduce(function(a,p){return a+p.amount},0)).toLocaleString('id-ID'),'Total pemasukan')+'</div>'
  +'<h2>Aktivitas per jenis</h2>'+Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).map(function(k){return '<div class="bar"><em>'+esc(k)+'</em><i style="width:'+Math.round(cnt[k]/max*60)+'%"></i><span>'+cnt[k]+'</span></div>'}).join('')
  +'<h2>Siapa yang klik "Beli Pro"</h2><div class="scroll"><table><tr><th>Waktu</th><th>Akun</th></tr>'+ev.filter(function(e){return e.name==='klik_beli_pro'}).slice(0,30).map(function(e){return '<tr><td>'+new Date(e.created_at).toLocaleString('id-ID')+'</td><td>'+esc(email[e.user_id]||'(belum login)')+'</td></tr>'}).join('')+'</table></div>'
  +'<h2>Akun terdaftar</h2><div class="scroll"><table><tr><th>Email</th><th>Paket</th><th>Berlaku sampai</th><th>Daftar</th></tr>'+pr.map(function(p){var on=p.plan==='pro'&&p.plan_until&&new Date(p.plan_until)>new Date();return '<tr><td>'+esc(p.email)+'</td><td><span class="pill '+(on?'pro':'')+'">'+(on?'Pro':'Free')+'</span></td><td>'+(p.plan_until?new Date(p.plan_until).toLocaleDateString('id-ID'):'-')+'</td><td>'+new Date(p.created_at).toLocaleDateString('id-ID')+'</td></tr>'}).join('')+'</table></div>'
  +'<h2>Pembayaran</h2><div class="scroll"><table><tr><th>Waktu</th><th>Akun</th><th>Jumlah</th><th>Status</th></tr>'+pay.map(function(p){return '<tr><td>'+new Date(p.created_at).toLocaleString('id-ID')+'</td><td>'+esc(email[p.user_id])+'</td><td>Rp'+p.amount.toLocaleString('id-ID')+'</td><td>'+esc(p.status)+'</td></tr>'}).join('')+'</table></div>'
  +'<h2>Aktivitas terbaru</h2><div class="scroll"><table><tr><th>Waktu</th><th>Kejadian</th><th>Akun</th></tr>'+ev.slice(0,50).map(function(e){return '<tr><td>'+new Date(e.created_at).toLocaleString('id-ID')+'</td><td>'+esc(e.name)+'</td><td>'+esc(email[e.user_id]||'pengunjung anonim')+'</td></tr>'}).join('')+'</table></div></div>';
  document.getElementById('out').onclick=async function(ev2){ev2.preventDefault();await sb.auth.signOut();loginView();};
}
load();
</script></body></html>
